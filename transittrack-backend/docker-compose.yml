version: '3.8'

services:
  # MySQL Database Service
  mysql:
    image: mysql:8.0
    container_name: transittrack-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: transittrack_db
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: transittrack
      MYSQL_PASSWORD: transittrack
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - transit-network

  # TransitTrack Spring Boot Backend
  transittrack-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: transittrack-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://mysql:3306/transittrack_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: root
      DB_PASSWORD: root
      SPRING_PROFILES_ACTIVE: default
    ports:
      - "8080:8080"
    networks:
      - transit-network

networks:
  transit-network:
    driver: bridge

volumes:
  mysql_data:
    driver: local
